<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wetter</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f80ed" id="tc">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--glass:rgba(255,255,255,.15);--line:rgba(255,255,255,.24);--tx:#fff;--mu:rgba(255,255,255,.75)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{min-height:100vh;font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--tx);background:#2f80ed;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:var(--bg)}
[data-theme=clear-day]{--bg:linear-gradient(180deg,#2f80ed 0%,#56ccf2 100%)}
[data-theme=clear-night]{--bg:linear-gradient(180deg,#0b1026 0%,#1d2f69 100%)}
[data-theme=cloud-day]{--bg:linear-gradient(180deg,#52749c 0%,#98b2cc 100%)}
[data-theme=cloud-night]{--bg:linear-gradient(180deg,#171e2e 0%,#3a4660 100%)}
[data-theme=rain]{--bg:linear-gradient(180deg,#34445c 0%,#66798f 100%)}
[data-theme=snow]{--bg:linear-gradient(180deg,#58799f 0%,#9db7d4 100%)}
[data-theme=storm]{--bg:linear-gradient(180deg,#1b1730 0%,#4a3e6a 100%)}
[data-theme=fog]{--bg:linear-gradient(180deg,#667480 0%,#a3adb5 100%)}
#fx{position:fixed;inset:0;z-index:-1;pointer-events:none}
.wrap{max-width:980px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 40px}
.top{display:flex;gap:8px;align-items:center}
.search{position:relative;flex:1}
.search input{width:100%;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:#fff;padding:0 14px 0 40px;font:inherit;backdrop-filter:blur(18px);outline:none}
.search input::placeholder{color:var(--mu)}
.search input:focus{background:rgba(255,255,255,.24)}
.search svg{position:absolute;left:12px;top:12px;width:20px;height:20px;stroke:var(--mu);fill:none;stroke-width:2;stroke-linecap:round}
.sug{position:absolute;left:0;right:0;top:50px;z-index:10;background:rgba(18,28,48,.94);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:none}
.sug button{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;padding:11px 14px;font:inherit;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.08)}
.sug button:hover,.sug button.on{background:rgba(255,255,255,.12)}
.sug small{color:var(--mu);display:block}
.ib{width:42px;height:42px;flex:none;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:#fff;font:600 15px inherit;cursor:pointer;backdrop-filter:blur(18px);display:grid;place-items:center}
.ib:hover{background:rgba(255,255,255,.26)}
.ib svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.on svg{fill:#ffd54a;stroke:#ffd54a}
.favs{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.favs::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--glass);color:#fff;border-radius:999px;padding:5px 13px;font:inherit;font-size:.9rem;cursor:pointer;backdrop-filter:blur(18px)}
.chip.on{background:rgba(255,255,255,.34);font-weight:600}
.hero{text-align:center;padding:26px 0 8px}
.city{font-size:1.7rem;font-weight:600;letter-spacing:-.01em;text-shadow:0 1px 8px rgba(0,0,0,.15)}
.city small{display:block;font-size:.88rem;font-weight:400;color:var(--mu)}
.mainrow{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:2px}
.mainrow .ic{width:128px;height:128px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.2))}
.temp{font-size:6.4rem;font-weight:200;letter-spacing:-.04em;line-height:1;padding-left:4px;text-shadow:0 2px 14px rgba(0,0,0,.14)}
.cond{font-size:1.35rem;font-weight:500;margin-top:2px}
.hl{color:var(--mu);margin-top:4px}
.load{text-align:center;padding:90px 0;color:var(--mu)}
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);padding:14px 16px;margin-top:14px}
.card h3{font-size:.74rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--mu);margin-bottom:10px}
.hours{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.h{flex:none;min-width:58px;text-align:center}
.h .l{font-size:.88rem;font-weight:500}
.h .ic{width:36px;height:36px;display:block;margin:4px auto 0}
.h .p{height:14px;font-size:.72rem;font-weight:600;color:#9bd4ff}
.h .v{font-size:1.05rem;font-weight:600}
.day{display:grid;grid-template-columns:58px 34px 40px 38px 1fr 38px;align-items:center;gap:6px;padding:9px 0;border-top:1px solid rgba(255,255,255,.14)}
.day:first-of-type{border-top:0}
.day .ic{width:32px;height:32px}
.day .n{font-weight:600}
.day .p{font-size:.78rem;color:#9bd4ff;font-weight:600}
.day .lo{color:var(--mu);text-align:right}
.day .hi{font-weight:600}
.track{height:5px;border-radius:5px;background:rgba(0,0,0,.2);position:relative}
.track i{position:absolute;top:0;bottom:0;border-radius:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:14px}
.grid .card{margin-top:0}
.big{font-size:2rem;font-weight:500;line-height:1.1}
.big small{font-size:1rem;font-weight:400;color:var(--mu)}
.sub{color:var(--mu);font-size:.88rem;margin-top:6px}
.bar{height:6px;border-radius:6px;margin-top:12px;position:relative;background:linear-gradient(90deg,#4cd964,#ffd60a,#ff9f0a,#ff3b30,#af52de)}
.bar i{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.25);transform:translateX(-50%)}
.row2{display:flex;align-items:center;justify-content:space-between;gap:10px}
.compass{width:76px;height:76px;flex:none}
.sunarc{width:100%;max-width:230px;display:block;margin:2px auto 0}
.sunt{display:flex;justify-content:space-between;font-size:.88rem;color:var(--mu);max-width:230px;margin:0 auto}
.sunt b{color:#fff;font-weight:600}
.foot{text-align:center;color:var(--mu);font-size:.8rem;margin-top:26px}
.foot a{color:#fff}
.pill{margin-top:14px;border:1px solid var(--line);background:var(--glass);color:#fff;padding:9px 18px;border-radius:999px;font:inherit;cursor:pointer}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(10,15,25,.9);color:#fff;padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.toast.show{opacity:1}
.fl{animation:fl 7s ease-in-out infinite}
.spin{transform-origin:32px 32px;animation:spin 40s linear infinite}
.dr{animation:dr 1.1s linear infinite}.d2{animation-delay:.35s}.d3{animation-delay:.7s}
.sn{animation:sn 2.6s ease-in-out infinite}.s2{animation-delay:.8s}.s3{animation-delay:1.6s}
.bolt{animation:bolt 3s steps(1) infinite}
.fg{animation:fg 5s ease-in-out infinite}.f2{animation-delay:1.2s}.f3{animation-delay:2.4s}
#view.pg{cursor:grab;user-select:none;-webkit-user-select:none}
#view.drag{cursor:grabbing}
#hero,#sum,#daily,#tiles,#foot{touch-action:pan-y}
.hours{cursor:grab}
.rm{margin-top:12px;border:1px solid var(--line);background:rgba(0,0,0,.12);color:#fff;padding:5px 14px;border-radius:999px;font:inherit;font-size:.82rem;cursor:pointer}
.rm:hover{background:rgba(0,0,0,.25)}
.hint{margin-top:6px}
.ib.lg{font-size:.82rem;letter-spacing:.02em}
@keyframes fl{50%{transform:translate(2px,-1.5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dr{0%{transform:translateY(-4px);opacity:0}30%{opacity:1}100%{transform:translateY(9px);opacity:0}}
@keyframes sn{0%,100%{transform:translate(0,-3px);opacity:.3}50%{transform:translate(2px,4px);opacity:1}}
@keyframes bolt{0%,60%,100%{opacity:1}65%,75%{opacity:.25}70%{opacity:1}}
@keyframes fg{50%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:520px){.temp{font-size:5.2rem}.mainrow .ic{width:104px;height:104px}.day{grid-template-columns:50px 30px 36px 34px 1fr 34px;gap:4px}}
</style>
</head>
<body data-theme="clear-day">
<canvas id="fx"></canvas>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#ffa51f"/></linearGradient>
<linearGradient id="gm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff7da"/><stop offset="1" stop-color="#e6d79c"/></linearGradient>
<linearGradient id="gc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9e4f2"/></linearGradient>
<linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d3dce8"/><stop offset="1" stop-color="#8393a8"/></linearGradient>
</defs></svg>

<div class="wrap">
  <div class="top">
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" autocomplete="off">
      <div class="sug" id="sug"></div>
    </div>
    <button class="ib" id="loc"><svg viewBox="0 0 24 24"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.5"/></svg></button>
    <button class="ib" id="un">°C</button>
    <button class="ib lg" id="lang">DE</button>
  </div>
  <div class="favs" id="favs"></div>

  <div id="view">
    <div id="hero"><div class="load"></div></div>
    <div id="sum"></div>
    <div id="hourly"></div>
    <div id="daily"></div>
    <div class="grid" id="tiles"></div>
    <p class="foot" id="foot"></p>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ls = { get:(k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
             set:(k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

/* ---------- Sprache ---------- */
const I = {
  de:{ search:'Ort hinzufügen …', locate:'Mein Standort', unit:'Einheit wechseln', langBtn:'Sprache wechseln', remove:'✕ Ort entfernen',
    loading:'Lade Wetter …', err:'Wetter konnte nicht geladen werden.', net:'Prüfe deine Internetverbindung.', retry:'Erneut versuchen', noHits:'Keine Treffer',
    locating:'Standort wird ermittelt …', noLoc:'Standort nicht verfügbar – suche einen Ort.', myLoc:'Mein Standort', added:'Ort hinzugefügt',
    removed:'Ort entfernt', lastOne:'Der letzte Ort kann nicht entfernt werden.', today:'Heute', now:'Jetzt', high:'Höchstwert', low:'Tiefstwert',
    hourly:'Stündliche Vorhersage', daily:'7-Tage-Vorhersage', feels:'Gefühlt', wind:'Wind', uv:'UV-Index', sun:'Sonne', precip:'Niederschlag',
    humidity:'Luftfeuchtigkeit', vis:'Sichtweite', press:'Luftdruck', aqi:'Luftqualität',
    summary:(c, lo, hi, pm, w) => `${c}, ${lo} bis ${hi}.${pm >= 30 ? ` Die Regenwahrscheinlichkeit liegt bei bis zu ${pm} %.` : ' Kaum Niederschlag zu erwarten.'} Wind bis ${w} km/h.`,
    feelsSame:'Entspricht in etwa der tatsächlichen Temperatur.', feelsCold:'Wind oder Feuchtigkeit lassen es kälter wirken.', feelsWarm:'Es fühlt sich wärmer an als gemessen.',
    gusts:'Böen bis', from:'aus', peak:'Tageshöchstwert', rise:'Aufgang', set:'Untergang', mmToday:'mm heute', rainUp:'Regenwahrscheinlichkeit bis', tomorrow:'Morgen',
    dew:'Taupunkt', v1:'Ausgezeichnete Sicht.', v2:'Gute Sicht.', v3:'Eingeschränkte Sicht.', v4:'Sehr schlechte Sicht.',
    p1:'Niedrig – eher unbeständig.', p2:'Normaler Bereich.', p3:'Hoch – eher stabil.',
    uvL:['Niedrig','Mäßig','Hoch','Sehr hoch','Extrem'], aqiL:['Sehr gut','Gut','Mäßig','Schlecht','Sehr schlecht','Extrem schlecht'],
    pm:(a, b) => `Feinstaub PM2,5: ${a} µg/m³ · PM10: ${b} µg/m³`, upd:t => `Aktualisiert um ${t} Uhr`, src:'Wetterdaten von',
    hint:'Wische nach links oder rechts (oder nutze die Pfeiltasten), um den Ort zu wechseln.',
    dirs:['N','NNO','NO','ONO','O','OSO','SO','SSO','S','SSW','SW','WSW','W','WNW','NW','NNW'], card:['N','O','S','W'],
    wmo:{0:'Klar',1:'Überwiegend klar',2:'Teils bewölkt',3:'Bedeckt',45:'Nebel',48:'Reifnebel',51:'Leichter Nieselregen',53:'Nieselregen',55:'Starker Nieselregen',
      56:'Gefrierender Nieselregen',57:'Gefrierender Nieselregen',61:'Leichter Regen',63:'Regen',65:'Starker Regen',66:'Gefrierender Regen',67:'Gefrierender Regen',
      71:'Leichter Schneefall',73:'Schneefall',75:'Starker Schneefall',77:'Schneegriesel',80:'Leichte Regenschauer',81:'Regenschauer',82:'Heftige Regenschauer',
      85:'Leichte Schneeschauer',86:'Starke Schneeschauer',95:'Gewitter',96:'Gewitter mit Hagel',99:'Gewitter mit starkem Hagel'} },
  en:{ search:'Add a place …', locate:'My location', unit:'Switch unit', langBtn:'Switch language', remove:'✕ Remove place',
    loading:'Loading weather …', err:'Weather could not be loaded.', net:'Please check your internet connection.', retry:'Try again', noHits:'No results',
    locating:'Finding your location …', noLoc:'Location unavailable – search for a place.', myLoc:'My location', added:'Place added',
    removed:'Place removed', lastOne:'The last place cannot be removed.', today:'Today', now:'Now', high:'High', low:'Low',
    hourly:'Hourly forecast', daily:'7-day forecast', feels:'Feels like', wind:'Wind', uv:'UV index', sun:'Sun', precip:'Precipitation',
    humidity:'Humidity', vis:'Visibility', press:'Pressure', aqi:'Air quality',
    summary:(c, lo, hi, pm, w) => `${c}, ${lo} to ${hi}.${pm >= 30 ? ` Chance of rain up to ${pm}%.` : ' Little to no precipitation expected.'} Wind up to ${w} km/h.`,
    feelsSame:'About the same as the actual temperature.', feelsCold:'Wind or humidity make it feel colder.', feelsWarm:'It feels warmer than measured.',
    gusts:'Gusts up to', from:'from', peak:'Daily peak', rise:'Sunrise', set:'Sunset', mmToday:'mm today', rainUp:'Chance of rain up to', tomorrow:'Tomorrow',
    dew:'Dew point', v1:'Excellent visibility.', v2:'Good visibility.', v3:'Reduced visibility.', v4:'Very poor visibility.',
    p1:'Low – rather unsettled.', p2:'Normal range.', p3:'High – rather stable.',
    uvL:['Low','Moderate','High','Very high','Extreme'], aqiL:['Very good','Good','Moderate','Poor','Very poor','Extremely poor'],
    pm:(a, b) => `Fine particles PM2.5: ${a} µg/m³ · PM10: ${b} µg/m³`, upd:t => `Updated at ${t}`, src:'Weather data by',
    hint:'Swipe left or right (or use the arrow keys) to switch places.',
    dirs:['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'], card:['N','E','S','W'],
    wmo:{0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Rime fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',
      56:'Freezing drizzle',57:'Freezing drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',
      71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Light showers',81:'Showers',82:'Violent showers',
      85:'Light snow showers',86:'Heavy snow showers',95:'Thunderstorm',96:'Thunderstorm with hail',99:'Thunderstorm with heavy hail'} }
};
let lang = ls.get('wx:lang', (navigator.language || 'de').toLowerCase().startsWith('de') ? 'de' : 'en');
const tr = k => I[lang][k] ?? k;
const loc = () => lang === 'de' ? 'de-DE' : 'en-US';
const nf = (v, d = 0) => Number(v).toLocaleString(loc(), { minimumFractionDigits:d, maximumFractionDigits:d });
function fmtT(s) { const h = +s.slice(11, 13), m = s.slice(14, 16);
  return lang === 'de' ? `${s.slice(11, 13)}:${m}` : `${h % 12 || 12}:${m} ${h < 12 ? 'AM' : 'PM'}`; }
function fmtH(s) { const h = +s.slice(11, 13); return lang === 'de' ? `${s.slice(11, 13)} Uhr` : `${h % 12 || 12} ${h < 12 ? 'AM' : 'PM'}`; }

/* ---------- Zustand ---------- */
let unit = ls.get('wx:unit', 'C'), places = ls.get('wx:places', null), idx = ls.get('wx:idx', 0);
const cache = {};
const BERLIN = { name:'Berlin', sub:'Deutschland', lat:52.52, lon:13.405 };
const T = c => (unit === 'C' ? Math.round(c) : Math.round(c * 9 / 5 + 32)) + '°';
const same = (a, b) => Math.abs(a.lat - b.lat) < .001 && Math.abs(a.lon - b.lon) < .001;
const pid = p => p.gps ? 'gps' : `${p.lat.toFixed(3)},${p.lon.toFixed(3)}`;
if (!places) {   // Übernahme aus der Vorgängerversion
  places = [...ls.get('wx:favs', [])];
  const old = ls.get('wx:last', null);
  if (old && !places.some(p => same(p, old))) places.unshift(old);
}
places.forEach(p => { p.id = pid(p); });
idx = clamp(+idx || 0, 0, Math.max(0, places.length - 1));
const savePlaces = () => { ls.set('wx:places', places); ls.set('wx:idx', idx); };
const cur = () => places[idx];

function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600); }

/* ---------- Wettercodes ---------- */
function kind(c) {
  if (c <= 1) return 'clear'; if (c === 2) return 'partly'; if (c === 3) return 'cloud';
  if (c === 45 || c === 48) return 'fog';
  if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82)) return 'rain';
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) return 'snow';
  return 'storm';
}
function themeOf(k, day) {
  if (k === 'clear' || k === 'partly') return day ? 'clear-day' : 'clear-night';
  if (k === 'cloud') return day ? 'cloud-day' : 'cloud-night';
  return k;
}

/* ---------- Icons ---------- */
const CLOUD = '<path d="M20 46a9 9 0 0 1-1-18 13 13 0 0 1 25-2 10 10 0 0 1 2 20z"/>';
let rays = '';
for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, c = Math.cos(a), s = Math.sin(a);
  rays += `<line x1="${(32 + 17 * c).toFixed(1)}" y1="${(32 + 17 * s).toFixed(1)}" x2="${(32 + 24 * c).toFixed(1)}" y2="${(32 + 24 * s).toFixed(1)}"/>`; }
const SUN = `<g class="spin"><g stroke="url(#gs)" stroke-width="3.6" stroke-linecap="round">${rays}</g></g><circle cx="32" cy="32" r="12" fill="url(#gs)"/>`;
const MOON = '<path d="M38 12a20 20 0 1 0 14 34 16 16 0 0 1-14-34z" fill="url(#gm)"/>';
function icon(k, day) {
  let b = '';
  if (k === 'clear') b = day ? SUN : MOON;
  else if (k === 'partly') b = `<g transform="translate(-5,-7) scale(.78)">${day ? SUN : MOON}</g><g class="fl" fill="url(#gc)" transform="translate(6,9) scale(.86)">${CLOUD}</g>`;
  else if (k === 'cloud') b = `<g fill="url(#gd)" transform="translate(15,2) scale(.74)">${CLOUD}</g><g class="fl" fill="url(#gc)" transform="translate(-2,8)">${CLOUD}</g>`;
  else if (k === 'rain') b = `<g fill="url(#gd)" transform="translate(0,-6)">${CLOUD}</g><g stroke="#8ec9ff" stroke-width="3" stroke-linecap="round"><path class="dr" d="M23 47l-2 6"/><path class="dr d2" d="M33 48l-2 6"/><path class="dr d3" d="M43 47l-2 6"/></g>`;
  else if (k === 'snow') b = `<g fill="url(#gd)" transform="translate(0,-6)">${CLOUD}</g><g fill="#fff"><circle class="sn" cx="23" cy="50" r="2.6"/><circle class="sn s2" cx="33" cy="54" r="2.6"/><circle class="sn s3" cx="43" cy="50" r="2.6"/></g>`;
  else if (k === 'storm') b = `<g fill="url(#gd)" transform="translate(0,-6)">${CLOUD}</g><polygon class="bolt" points="35,38 26,53 33,53 29,63 43,46 36,46 40,38" fill="#ffd54a"/>`;
  else b = `<g fill="url(#gc)" transform="translate(0,-8)">${CLOUD}</g><g stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".85"><path class="fg" d="M16 46h30"/><path class="fg f2" d="M22 52h30"/><path class="fg f3" d="M14 58h26"/></g>`;
  return `<svg viewBox="0 0 64 64" class="ic" aria-hidden="true">${b}</svg>`;
}

/* ---------- Hintergrund-Effekte ---------- */
const cv = $('#fx'), cx = cv.getContext('2d');
let fxMode = '', parts = [], raf = 0, flash = 0;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function fxSize() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener('resize', fxSize); fxSize();
function setFx(m) {
  if (m === fxMode) return;
  fxMode = m; cancelAnimationFrame(raf); cx.clearRect(0, 0, cv.width, cv.height);
  if (!m || reduce) return;
  const n = m === 'snow' ? 90 : m === 'stars' ? 90 : m === 'storm' ? 190 : 140;
  parts = Array.from({ length:n }, () => ({ x:Math.random() * cv.width, y:Math.random() * cv.height,
    l:10 + Math.random() * 14, v:(m === 'snow' ? .6 : 12) + Math.random() * (m === 'snow' ? 1.3 : 10),
    r:.6 + Math.random() * 2.2, ph:Math.random() * 6 }));
  loop();
}
function loop(t = 0) {
  cx.clearRect(0, 0, cv.width, cv.height);
  if (fxMode === 'rain' || fxMode === 'storm') {
    cx.strokeStyle = 'rgba(255,255,255,.32)'; cx.lineWidth = 1.2; cx.beginPath();
    for (const p of parts) { cx.moveTo(p.x, p.y); cx.lineTo(p.x - 2, p.y + p.l); p.y += p.v; p.x -= .6;
      if (p.y > cv.height) { p.y = -20; p.x = Math.random() * cv.width + 30; } }
    cx.stroke();
    if (fxMode === 'storm') { if (Math.random() < .004) flash = 7;
      if (flash > 0) { cx.fillStyle = `rgba(255,255,255,${flash / 40})`; cx.fillRect(0, 0, cv.width, cv.height); flash--; } }
  } else if (fxMode === 'snow') {
    cx.fillStyle = 'rgba(255,255,255,.85)';
    for (const p of parts) { p.y += p.v; p.x += Math.sin(t / 900 + p.ph) * .5;
      if (p.y > cv.height) { p.y = -5; p.x = Math.random() * cv.width; }
      cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.3); cx.fill(); }
  } else if (fxMode === 'stars') {
    for (const p of parts) { cx.fillStyle = `rgba(255,255,255,${.25 + .6 * Math.abs(Math.sin(t / 1400 + p.ph))})`;
      cx.beginPath(); cx.arc(p.x, p.y % (cv.height * .65), p.r * .6, 0, 6.3); cx.fill(); }
  }
  raf = requestAnimationFrame(loop);
}

/* ---------- Daten ---------- */
async function getJson(u) { const r = await fetch(u); if (!r.ok) throw new Error(r.status); return r.json(); }
async function fetchPlace(p) {
  const f = `https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}`
    + '&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m'
    + '&hourly=temperature_2m,precipitation_probability,weather_code,is_day,visibility,dew_point_2m,uv_index'
    + '&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_sum,precipitation_probability_max,wind_speed_10m_max'
    + '&timezone=auto&forecast_days=7';
  const a = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${p.lat}&longitude=${p.lon}&current=european_aqi,pm10,pm2_5&timezone=auto`;
  const [w, q] = await Promise.all([getJson(f), getJson(a).catch(() => null)]);
  cache[p.id] = { data:w, aqi:q?.current || null, stamp:Date.now() };
}
async function show() {
  const p = cur(); if (!p) return;
  savePlaces(); renderChips(); scrollTo(0, 0);
  if (cache[p.id]) { draw(); if (Date.now() - cache[p.id].stamp > 10 * 60e3) refresh(p); return; }
  $('#hero').innerHTML = `<div class="load">${esc(tr('loading'))}</div>`;
  ['#sum', '#hourly', '#daily', '#tiles', '#foot'].forEach(s => $(s).innerHTML = '');
  try { await fetchPlace(p); if (cur() === p) draw(); }
  catch {
    if (cur() !== p) return;
    $('#hero').innerHTML = `<div class="load">${esc(tr('err'))}<br>${esc(tr('net'))}<br><button class="pill" id="retry">${esc(tr('retry'))}</button></div>`;
    $('#retry').onclick = show;
  }
}
function refresh(p) { fetchPlace(p).then(() => { if (cur() === p) draw(); }).catch(() => {}); }

/* ---------- Darstellung ---------- */
const mins = s => +s.slice(11, 13) * 60 + +s.slice(14, 16);
const hue = t => clamp(210 - (t + 12) / 46 * 190, 15, 210);
const uvIdx = u => u < 3 ? 0 : u < 6 ? 1 : u < 8 ? 2 : u < 11 ? 3 : 4;
const aqiIdx = v => v <= 20 ? 0 : v <= 40 ? 1 : v <= 60 ? 2 : v <= 80 ? 3 : v <= 100 ? 4 : 5;

function draw() {
  const place = cur(), { data, aqi, stamp } = cache[place.id];
  const c = data.current, h = data.hourly, d = data.daily;
  const hi = Math.max(0, h.time.indexOf(c.time.slice(0, 13) + ':00'));
  const day = !!c.is_day, k = kind(c.weather_code), cond = tr('wmo')[c.weather_code] || '–';
  const th = themeOf(k, day);
  document.body.dataset.theme = th;
  $('#tc').content = { 'clear-day':'#2f80ed','clear-night':'#0b1026','cloud-day':'#52749c','cloud-night':'#171e2e',rain:'#34445c',snow:'#58799f',storm:'#1b1730',fog:'#667480' }[th];
  setFx(k === 'rain' ? 'rain' : k === 'storm' ? 'storm' : k === 'snow' ? 'snow' : th === 'clear-night' ? 'stars' : '');

  const name = place.gps && place.name === 'Mein Standort' ? tr('myLoc') : place.name;
  $('#hero').innerHTML = `<div class="hero"><div class="city">${esc(name)}${place.sub ? `<small>${esc(place.sub)}</small>` : ''}</div>
    <div class="mainrow">${icon(k, day)}<div class="temp">${T(c.temperature_2m)}</div></div>
    <div class="cond">${esc(cond)}</div>
    <div class="hl">${tr('high')} ${T(d.temperature_2m_max[0])} · ${tr('low')} ${T(d.temperature_2m_min[0])}</div>
    ${places.length > 1 ? `<button class="rm" id="rm">${esc(tr('remove'))}</button>` : ''}</div>`;

  const pm = d.precipitation_probability_max[0] ?? 0;
  $('#sum').innerHTML = `<div class="card"><h3>${tr('today')}</h3>${esc(tr('summary')(tr('wmo')[d.weather_code[0]] || cond, T(d.temperature_2m_min[0]), T(d.temperature_2m_max[0]), pm, Math.round(d.wind_speed_10m_max[0])))}</div>`;

  let hr = '';
  for (let i = hi; i < Math.min(hi + 25, h.time.length); i++) {
    const p = h.precipitation_probability[i];
    hr += `<div class="h"><div class="l">${i === hi ? tr('now') : fmtH(h.time[i])}</div>${icon(kind(h.weather_code[i]), h.is_day[i])}
      <div class="p">${p >= 10 ? p + ' %' : ''}</div><div class="v">${T(h.temperature_2m[i])}</div></div>`;
  }
  $('#hourly').innerHTML = `<div class="card"><h3>${tr('hourly')}</h3><div class="hours">${hr}</div></div>`;

  const wmin = Math.min(...d.temperature_2m_min), wmax = Math.max(...d.temperature_2m_max), span = Math.max(1, wmax - wmin);
  let dy = '';
  d.time.forEach((t, i) => {
    const lo = d.temperature_2m_min[i], hg = d.temperature_2m_max[i], p = d.precipitation_probability_max[i] ?? 0;
    const nm = i === 0 ? tr('today') : new Date(t + 'T12:00:00').toLocaleDateString(loc(), { weekday:'short' });
    dy += `<div class="day"><div class="n">${nm}</div>${icon(kind(d.weather_code[i]), 1)}<div class="p">${p >= 10 ? p + ' %' : ''}</div>
      <div class="lo">${T(lo)}</div><div class="track"><i style="left:${(lo - wmin) / span * 100}%;right:${100 - (hg - wmin) / span * 100}%;background:linear-gradient(90deg,hsl(${hue(lo)},85%,62%),hsl(${hue(hg)},90%,60%))"></i></div><div class="hi">${T(hg)}</div></div>`;
  });
  $('#daily').innerHTML = `<div class="card"><h3>${tr('daily')}</h3>${dy}</div>`;

  const tile = (t, body) => `<div class="card"><h3>${t}</h3>${body}</div>`;
  const uv = h.uv_index[hi] ?? 0, wdir = c.wind_direction_10m;
  const rise = mins(d.sunrise[0]), set = mins(d.sunset[0]), now = mins(c.time);
  const sp = clamp((now - rise) / (set - rise), 0, 1);
  const sx = 80 - 70 * Math.cos(Math.PI * sp), sy = 80 - 70 * Math.sin(Math.PI * sp);
  const diff = c.apparent_temperature - c.temperature_2m;
  const vis = (h.visibility[hi] ?? 0) / 1000, press = c.pressure_msl, cd = tr('card');
  let t = '';
  t += tile(tr('feels'), `<div class="big">${T(c.apparent_temperature)}</div><div class="sub">${Math.abs(diff) < 1.5 ? tr('feelsSame') : diff < 0 ? tr('feelsCold') : tr('feelsWarm')}</div>`);
  t += tile(tr('wind'), `<div class="row2"><div><div class="big">${Math.round(c.wind_speed_10m)} <small>km/h</small></div>
    <div class="sub">${tr('gusts')} ${Math.round(c.wind_gusts_10m)} km/h<br>${tr('from')} ${tr('dirs')[Math.round(wdir / 22.5) % 16]}</div></div>
    <svg class="compass" viewBox="0 0 80 80"><circle cx="40" cy="40" r="35" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
    <g fill="rgba(255,255,255,.75)" font-size="9" text-anchor="middle"><text x="40" y="13">${cd[0]}</text><text x="68" y="43">${cd[1]}</text><text x="40" y="74">${cd[2]}</text><text x="12" y="43">${cd[3]}</text></g>
    <g transform="rotate(${wdir + 180} 40 40)"><polygon points="40,18 46,44 40,40 34,44" fill="#fff"/><line x1="40" y1="40" x2="40" y2="58" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></g></svg></div>`);
  t += tile(tr('uv'), `<div class="big">${nf(uv, uv < 10 ? 1 : 0)} <small>${tr('uvL')[uvIdx(uv)]}</small></div><div class="bar"><i style="left:${clamp(uv / 11, 0, 1) * 100}%"></i></div><div class="sub">${tr('peak')}: ${nf(d.uv_index_max[0] ?? 0, 1)}</div>`);
  t += tile(tr('sun'), `<svg class="sunarc" viewBox="0 0 160 90"><path d="M10 80A70 70 0 0 1 150 80" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="3" stroke-dasharray="3 5"/>
    <path d="M10 80A70 70 0 0 1 150 80" pathLength="100" fill="none" stroke="#ffd54a" stroke-width="3" stroke-linecap="round" stroke-dasharray="${sp * 100} 100"/>
    <line x1="0" y1="80" x2="160" y2="80" stroke="rgba(255,255,255,.3)"/><circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="6" fill="${sp > 0 && sp < 1 ? '#ffd54a' : 'rgba(255,255,255,.6)'}"/></svg>
    <div class="sunt"><span>${tr('rise')}<br><b>${fmtT(d.sunrise[0])}</b></span><span style="text-align:right">${tr('set')}<br><b>${fmtT(d.sunset[0])}</b></span></div>`);
  t += tile(tr('precip'), `<div class="big">${nf(d.precipitation_sum[0] ?? 0, 1)} <small>${tr('mmToday')}</small></div><div class="sub">${tr('rainUp')} ${pm} %<br>${tr('tomorrow')}: ${nf(d.precipitation_sum[1] ?? 0, 1)} mm</div>`);
  t += tile(tr('humidity'), `<div class="big">${Math.round(c.relative_humidity_2m)} <small>%</small></div><div class="sub">${tr('dew')}: ${T(h.dew_point_2m[hi])}</div>`);
  t += tile(tr('vis'), `<div class="big">${vis >= 10 ? Math.round(vis) : nf(vis, 1)} <small>km</small></div><div class="sub">${vis >= 10 ? tr('v1') : vis >= 4 ? tr('v2') : vis >= 1 ? tr('v3') : tr('v4')}</div>`);
  t += tile(tr('press'), `<div class="big">${Math.round(press)} <small>hPa</small></div><div class="sub">${press < 1000 ? tr('p1') : press > 1020 ? tr('p3') : tr('p2')}</div>`);
  if (aqi && aqi.european_aqi != null) t += tile(tr('aqi'), `<div class="big">${Math.round(aqi.european_aqi)} <small>${tr('aqiL')[aqiIdx(aqi.european_aqi)]}</small></div>
    <div class="bar"><i style="left:${clamp(aqi.european_aqi / 120, 0, 1) * 100}%"></i></div><div class="sub">${tr('pm')(Math.round(aqi.pm2_5), Math.round(aqi.pm10))}</div>`);
  $('#tiles').innerHTML = t;

  $('#foot').innerHTML = `${esc(tr('upd')(new Date(stamp).toLocaleTimeString(loc(), { hour:'2-digit', minute:'2-digit' })))}<br>${tr('src')} <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo.com</a> (CC BY 4.0)`
    + (places.length > 1 ? `<div class="hint">${esc(tr('hint'))}</div>` : '');
  $('#view').classList.toggle('pg', places.length > 1);
  renderChips();
}

function applyStatic() {
  document.documentElement.lang = lang;
  $('#q').placeholder = tr('search'); $('#q').setAttribute('aria-label', tr('search'));
  $('#loc').setAttribute('aria-label', tr('locate')); $('#loc').title = tr('locate');
  $('#un').setAttribute('aria-label', tr('unit')); $('#un').textContent = '°' + unit;
  $('#lang').setAttribute('aria-label', tr('langBtn')); $('#lang').title = tr('langBtn'); $('#lang').textContent = lang.toUpperCase();
}

/* ---------- Orte ---------- */
function renderChips() {
  $('#favs').innerHTML = places.map((p, i) => `<button class="chip ${i === idx ? 'on' : ''}" data-i="${i}">${p.gps ? '📍 ' : ''}${esc(p.gps && p.name === 'Mein Standort' ? tr('myLoc') : p.name)}</button>`).join('');
  $('.chip.on')?.scrollIntoView?.({ inline:'center', block:'nearest', behavior:'smooth' });
}
$('#favs').onclick = e => { const b = e.target.closest('.chip'); if (b) goTo(+b.dataset.i); };

function goTo(i) { if (i === idx || i < 0 || i >= places.length) return; switchTo(i, i > idx ? 'left' : 'right'); }
function switchTo(ni, dir) {
  const v = $('#view'), out = dir === 'left' ? -1 : 1;
  v.style.transition = 'transform .2s ease-in, opacity .2s'; v.style.transform = `translateX(${out * innerWidth * .5}px)`; v.style.opacity = '0';
  setTimeout(() => {
    idx = ni; show();
    v.style.transition = 'none'; v.style.transform = `translateX(${-out * innerWidth * .4}px)`;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      v.style.transition = 'transform .3s ease-out, opacity .3s'; v.style.transform = ''; v.style.opacity = ''; }));
  }, 190);
}
function addPlace(p) {
  p.id = pid(p);
  const ex = places.findIndex(x => same(x, p));
  if (ex >= 0) return goTo(ex);
  places.push(p); savePlaces(); toast(tr('added')); goTo(places.length - 1);
}
function removeCurrent() {
  if (places.length < 2) return toast(tr('lastOne'));
  places.splice(idx, 1); idx = Math.min(idx, places.length - 1); toast(tr('removed')); show();
}
function setGps(p) {
  p.gps = true; p.id = 'gps'; delete cache.gps;
  const gi = places.findIndex(x => x.gps);
  if (gi >= 0) { places[gi] = p; savePlaces(); if (gi === idx) show(); else goTo(gi); return; }
  if (!places.length) { places.push(p); idx = 0; show(); return; }
  places.unshift(p); idx += 1; savePlaces(); switchTo(0, 'right');
}

/* ---------- Wischen & Ziehen ---------- */
const view = $('#view');
let drag = null, blockClick = false, hs = null;
view.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const hrs = e.target.closest('.hours');
  if (hrs) { if (e.pointerType === 'mouse') hs = { h:hrs, x:e.clientX, l:hrs.scrollLeft }; return; }
  if (places.length < 2 || e.target.closest('button, a')) return;
  drag = { x:e.clientX, y:e.clientY, t:Date.now(), dx:0, on:false, id:e.pointerId };
});
addEventListener('pointermove', e => {
  if (hs) { hs.h.scrollLeft = hs.l - (e.clientX - hs.x); return; }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.on) {
    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.3) { drag.on = true; view.classList.add('drag'); view.style.transition = 'none'; try { view.setPointerCapture(drag.id); } catch {} }
    else { if (Math.abs(dy) > 10) drag = null; return; }
  }
  drag.dx = dx;
  const edge = (idx === 0 && dx > 0) || (idx === places.length - 1 && dx < 0);
  view.style.transform = `translateX(${dx * (edge ? .25 : 1)}px)`;
  view.style.opacity = String(1 - Math.min(Math.abs(dx) / (innerWidth * 1.3), .45));
});
function endDrag() {
  hs = null;
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.on) return;
  view.classList.remove('drag');
  blockClick = true; setTimeout(() => blockClick = false, 60);
  const v = d.dx / Math.max(1, Date.now() - d.t);
  const go = (Math.abs(d.dx) > Math.min(innerWidth * .22, 140) || Math.abs(v) > .5) ? (d.dx < 0 ? 1 : -1) : 0;
  const ni = idx + go;
  if (!go || ni < 0 || ni >= places.length) {
    view.style.transition = 'transform .25s ease-out, opacity .25s'; view.style.transform = ''; view.style.opacity = ''; return;
  }
  switchTo(ni, d.dx < 0 ? 'left' : 'right');
}
addEventListener('pointerup', endDrag); addEventListener('pointercancel', endDrag);
view.addEventListener('click', e => {
  if (blockClick) { e.stopPropagation(); e.preventDefault(); return; }
  if (e.target.closest('#rm')) removeCurrent();
}, true);
addEventListener('keydown', e => {
  if (e.target.closest?.('input')) return;
  if (e.key === 'ArrowRight') goTo(idx + 1); else if (e.key === 'ArrowLeft') goTo(idx - 1);
});

/* ---------- Suche ---------- */
let tmr = 0, results = [], sel = -1;
const sug = $('#sug');
function closeSug() { sug.style.display = 'none'; sel = -1; }
$('#q').addEventListener('input', e => {
  clearTimeout(tmr); const v = e.target.value.trim();
  if (v.length < 2) return closeSug();
  tmr = setTimeout(async () => {
    try {
      const j = await getJson(`https://geocoding-api.open-meteo.com/v1/search?count=6&language=${lang}&format=json&name=` + encodeURIComponent(v));
      results = (j.results || []).map(r => ({ name:r.name, sub:[r.admin1, r.country].filter(Boolean).join(', '), lat:r.latitude, lon:r.longitude }));
      sug.innerHTML = results.map((r, i) => `<button data-i="${i}">${esc(r.name)}<small>${esc(r.sub)}</small></button>`).join('')
        || `<button disabled>${esc(tr('noHits'))}</button>`;
      sug.style.display = 'block'; sel = -1;
    } catch { closeSug(); }
  }, 250);
});
function pick(i) { const r = results[i]; if (!r) return; $('#q').value = ''; closeSug(); $('#q').blur(); addPlace(r); }
sug.onclick = e => { const b = e.target.closest('button[data-i]'); if (b) pick(+b.dataset.i); };
$('#q').addEventListener('keydown', e => {
  const bs = [...sug.querySelectorAll('button[data-i]')];
  if (e.key === 'ArrowDown') { sel = Math.min(bs.length - 1, sel + 1); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); e.preventDefault(); }
  else if (e.key === 'Enter') { pick(sel >= 0 ? sel : 0); return; }
  else if (e.key === 'Escape') return closeSug();
  bs.forEach((b, i) => b.classList.toggle('on', i === sel));
});
document.addEventListener('click', e => { if (!e.target.closest('.search')) closeSug(); });

/* ---------- Standort, Einheit, Sprache ---------- */
function locate(silent) {
  const fallback = () => { if (!places.length) { const p = { ...BERLIN }; p.id = pid(p); places.push(p); idx = 0; show(); } else if (!silent) toast(tr('noLoc')); };
  if (!navigator.geolocation) return fallback();
  navigator.geolocation.getCurrentPosition(async g => {
    const lat = g.coords.latitude, lon = g.coords.longitude;
    let name = 'Mein Standort', sub = '';
    try {
      const j = await getJson(`https://photon.komoot.io/reverse?lat=${lat}&lon=${lon}&lang=${lang}`);
      const p = j.features?.[0]?.properties || {};
      name = p.city || p.name || p.county || name; sub = [p.state, p.country].filter(Boolean).join(', ');
    } catch {}
    setGps({ name, sub, lat, lon });
  }, fallback, { timeout:10000, maximumAge:600000 });
}
$('#loc').onclick = () => { toast(tr('locating')); locate(false); };
$('#un').onclick = () => { unit = unit === 'C' ? 'F' : 'C'; ls.set('wx:unit', unit); applyStatic(); if (cur() && cache[cur().id]) draw(); };
$('#lang').onclick = () => { lang = lang === 'de' ? 'en' : 'de'; ls.set('wx:lang', lang); applyStatic(); if (cur() && cache[cur().id]) draw(); else if (cur()) $('#hero').innerHTML = `<div class="load">${esc(tr('loading'))}</div>`; renderChips(); };

setInterval(() => { const p = cur(); if (p && document.visibilityState === 'visible' && cache[p.id] && Date.now() - cache[p.id].stamp > 15 * 60e3) refresh(p); }, 60e3);
document.addEventListener('visibilitychange', () => { const p = cur(); if (p && document.visibilityState === 'visible' && cache[p.id] && Date.now() - cache[p.id].stamp > 10 * 60e3) refresh(p); });

applyStatic();
if (places.length) show(); else { $('#hero').innerHTML = `<div class="load">${esc(tr('loading'))}</div>`; locate(true); }

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
